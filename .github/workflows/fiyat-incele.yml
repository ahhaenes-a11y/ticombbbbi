{
 "name": "fiyat-incele",
 "on": {
  "workflow_dispatch": null
 },
 "jobs": {
  "incele": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12"
     }
    },
    {
     "run": "pip install requests"
    },
    {
     "run": "python incele.py"
    }
   ]
  }
 }
}
